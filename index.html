<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayz AI - Image Scraper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030305;
            --surface: #0a0a0d;
            --border: #111116;
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            --accent: #10b981; /* Emerald Green */
            --accent-dim: rgba(16, 185, 129, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* Layout Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 768px) {
            .main-grid { grid-template-columns: 1.2fr 1fr; }
        }

        /* Upload Area */
        .upload-zone {
            border: 1px dashed var(--border);
            background: var(--surface);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--accent-dim), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .upload-zone:hover::before, .upload-zone.active::before { opacity: 1; }
        .upload-zone.active { border-color: var(--accent); transform: scale(1.01); }

        /* Buttons */
        .btn-main {
            background: var(--accent);
            color: #000;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
        }
        .btn-main:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-dim); }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        /* Result Card */
        .result-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .url-display {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 0.8rem;
            color: var(--accent);
            word-break: break-all;
        }

        /* Loading */
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(5rem);
            background: #fff;
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-5xl">
        <!-- Header -->
        <header class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 rounded bg-[var(--accent)] flex items-center justify-center text-black font-bold shadow-lg shadow-[var(--accent-dim)]">K</div>
            <div>
                <h1 class="text-lg font-bold">Kayz AI Scraper</h1>
                <p class="text-[10px] text-[var(--text-muted)] mono">SYSTEM STABILIZED V3.2</p>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Left Column -->
            <div class="space-y-6">
                <!-- Upload Zone -->
                <div 
                    id="dropZone" 
                    class="upload-zone rounded-xl p-8 min-h-[250px] flex flex-col items-center justify-center cursor-pointer"
                    role="button"
                    tabindex="0"
                >
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    
                    <div id="idleState" class="text-center">
                        <div class="w-12 h-12 rounded bg-black border border-[var(--border)] flex items-center justify-center mx-auto mb-4">
                            <svg class="w-6 h-6 text-[var(--accent)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                        </div>
                        <p class="font-medium text-sm mb-1">Drop Image Here</p>
                        <p class="text-xs text-[var(--text-muted)]">Max 10MB (JPG, PNG, GIF)</p>
                    </div>

                    <div id="loadingState" class="hidden flex-col items-center">
                        <div class="spinner mb-3"></div>
                        <p class="text-sm text-[var(--text-muted)]" id="loadingText">Processing...</p>
                    </div>
                </div>

                <!-- Scrape Input -->
                <div class="flex gap-2">
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="Paste image URL to scrape..."
                        class="flex-1 bg-[var(--surface)] border border-[var(--border)] rounded px-3 py-2 text-sm focus:outline-none focus:border-[var(--accent)] mono"
                    >
                    <button id="scrapeBtn" class="btn-main text-sm py-2 px-4">Scrape</button>
                </div>
            </div>

            <!-- Right Column -->
            <div class="space-y-4">
                <div id="emptyState" class="h-full min-h-[300px] flex items-center justify-center border border-dashed border-[var(--border)] rounded-xl text-center p-6">
                    <div>
                        <p class="text-[var(--text-muted)] text-sm">Result will appear here</p>
                        <p class="text-xs text-[var(--text-muted)] mt-1 opacity-50">Brand: kayzai.org (via filename)</p>
                    </div>
                </div>

                <div id="resultCard" class="result-box hidden">
                    <div class="aspect-video bg-black/50 flex items-center justify-center overflow-hidden">
                        <img id="previewImg" src="" class="max-w-full max-h-full object-contain" alt="Preview">
                    </div>
                    <div class="p-4 space-y-3">
                        <div class="flex justify-between text-[10px] text-[var(--text-muted)]">
                            <span id="fileName">filename</span>
                            <span id="fileSize">0 KB</span>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] text-[var(--text-muted)] uppercase">Generated Link</span>
                                <button id="copyBtn" class="text-[10px] bg-white text-black px-2 py-0.5 rounded font-bold hover:opacity-80 transition-opacity">COPY</button>
                            </div>
                            <div class="url-display mono">
                                <span id="resultUrl">...</span>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button id="openBtn" class="btn-ghost flex-1 text-xs">Open Link</button>
                            <button id="newBtn" class="btn-main flex-1 text-xs py-2">New Upload</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Element -->
    <div id="toast" class="toast">Success!</div>

    <script>
        // --- UTILITIES ---
        const $ = (id) => document.getElementById(id);
        const formatSize = (bytes) => {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        };
        const generateBrandName = () => {
            // Format: Kayz_AI_randomstring.jpg
            const char = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
            let id = "";
            for(let i=0; i<6; i++) id += char.charAt(Math.floor(Math.random() * char.length));
            return `Kayz_AI_${id}.jpg`;
        };
        const showToast = (msg) => {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        };

        // --- DOM ELEMENTS ---
        const dropZone = $('dropZone');
        const fileInput = $('fileInput');
        const idleState = $('idleState');
        const loadingState = $('loadingState');
        const loadingText = $('loadingText');
        const resultCard = $('resultCard');
        const emptyState = $('emptyState');
        const previewImg = $('previewImg');
        const resultUrl = $('resultUrl');
        const fileName = $('fileName');
        const fileSize = $('fileSize');

        // --- EVENT LISTENERS ---
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', (e) => { if(e.key === 'Enter') fileInput.click(); });
        
        // Drag & Drop Styling
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        
        // Drop Handler
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        // File Input Change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        });

        // URL Scrape
        $('scrapeBtn').addEventListener('click', () => {
            const url = $('urlInput').value.trim();
            if(url) processUrl(url);
        });

        // Action Buttons
        $('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(resultUrl.textContent);
            showToast('Link berhasil disalin!');
        });
        $('openBtn').addEventListener('click', () => window.open(resultUrl.textContent, '_blank'));
        $('newBtn').addEventListener('click', () => {
            resultCard.classList.add('hidden');
            emptyState.classList.remove('hidden');
            $('urlInput').value = '';
            fileInput.value = '';
        });

        // --- CORE LOGIC ---

        function toggleLoading(show, text = "Processing...") {
            idleState.classList.toggle('hidden', show);
            loadingState.classList.toggle('hidden', !show);
            if(show) loadingText.textContent = text;
        }

        async function processFile(file) {
            if (!file.type.startsWith('image/')) return showToast('File harus gambar!');
            if (file.size > 10000000) return showToast('Maksimal 10MB!');

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                uploadImage(e.target.result, file.type);
            };
            reader.readAsDataURL(file);
        }

        async function processUrl(url) {
            toggleLoading(true, "Fetching image...");
            
            // Proxy untuk bypass CORS
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
            
            try {
                const res = await fetch(proxyUrl);
                const blob = await res.blob();
                
                if (!blob.type.startsWith('image/')) throw new Error("Not an image");
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    uploadImage(e.target.result, blob.type);
                };
                reader.readAsDataURL(blob);
            } catch (err) {
                toggleLoading(false);
                showToast("Gagal mengambil gambar dari URL");
                console.error(err);
            }
        }

        async function uploadImage(base64, mimeType) {
            toggleLoading(true, "Connecting to Server...");

            // Parsing Base64
            const parts = base64.split(',');
            const bstr = atob(parts[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }

            // Tentukan extension
            let ext = "jpg";
            if (mimeType.includes("png")) ext = "png";
            if (mimeType.includes("gif")) ext = "gif";
            if (mimeType.includes("webp")) ext = "webp";

            // --- RAHASIA "BRANDING" ---
            // Kita ubah nama file secara manual sebelum upload
            // Nama file ini akan menjadi bagian dari URL Telegraph
            const customFileName = generateBrandName().replace('.jpg', `.${ext}`);
            
            const blob = new Blob([u8arr], { type: mimeType });

            // UPLOAD KE TELEGRAPH
            const formData = new FormData();
            formData.append('file', blob, customFileName); // Inject custom filename here

            try {
                const res = await fetch('https://telegra.ph/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (data && data[0] && data[0].src) {
                    const finalUrl = "https://telegra.ph" + data[0].src;
                    
                    // Update UI
                    toggleLoading(false);
                    fileName.textContent = customFileName;
                    fileSize.textContent = formatSize(blob.size);
                    resultUrl.textContent = finalUrl;
                    
                    emptyState.classList.add('hidden');
                    resultCard.classList.remove('hidden');
                    
                    showToast("Upload Sukses!");
                } else {
                    throw new Error("Server response invalid");
                }
            } catch (err) {
                toggleLoading(false);
                showToast("Upload gagal, coba lagi.");
                console.error(err);
            }
        }
    </script>
</body>
</html>
